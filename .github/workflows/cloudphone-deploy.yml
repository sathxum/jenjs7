          set +x
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LANG=C /bin/bash --noprofile --norc -se <<'CP_ROOT'
          set -euo pipefail
          set +x
          umask 077
          [ "$EUID" = 0 ]
          cd /run/cloudphone-public-test
          cat >> reviewed-source.b64 <<'CP_SOURCE_BASE64'
          
          CP_SOURCE_BASE64
          chmod 0600 reviewed-source.b64
          CP_ROOT
      - name: Stage Reviewed Source Archive (3/22)
        run: |
          set -euo pipefail
          set +x
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LANG=C /bin/bash --noprofile --norc -se <<'CP_ROOT'
          set -euo pipefail
          set +x
          umask 077
          [ "$EUID" = 0 ]
          cd /run/cloudphone-public-test
          cat >> reviewed-source.b64 <<'CP_SOURCE_BASE64'
          
