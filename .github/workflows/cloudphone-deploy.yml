name: Proton Cloudphone Secure Access (DASHBOARD)
'on':
  push:
    paths:
      - .github/workflows/cloudphone-deploy.yml
  workflow_dispatch: null
permissions:
  contents: write
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Establish Total Job Budget
        id: job_budget
        env:
          CP_JOB_TOKEN: ${{ github.token }}
          CP_DURATION: '360'
        run: |
          set -euo pipefail
          set +x
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LANG=C /bin/bash --noprofile --norc -se <<'CP_ROOT'
          set -euo pipefail
          set +x
          umask 077
          cloudphone_namespace_check() {
            base64 --decode <<'CP_NAMESPACE_GZIP' | gzip --decompress | /usr/bin/timeout --signal=KILL 35s /usr/bin/python3 -I -B - --check
          
          CP_NAMESPACE_GZIP
          }
          set -euo pipefail
          set +x
          umask 077
          [[ $EUID = 0 ]] || { echo 'Namespace acquisition requires root'; exit 1; }
          [[ '92e85fcd77927a514583dc7b7f329537' =~ ^[A-Za-z0-9_-]{1,128}$ ]] || { echo 'Invalid deployment identity'; exit 1; }
          # Parent MUST define this trusted function in this same root shell immediately
          # before this fragment. Its body embeds namespace-check.py verbatim in a quoted
          # here-doc to: /usr/bin/timeout --signal=KILL 35s /usr/bin/python3 -I -B - --check
          # No cached check result, environment function import, or arbitrary script path.
          declare -F cloudphone_namespace_check >/dev/null || { echo 'Fresh namespace checker not staged'; exit 1; }
          cloudphone_namespace_check
          # Repeat fixed path absence at the ownership-creation boundary. Root/systemd
          # writers must remain excluded; only mkdir arbitrates concurrent acquisitions.
          for target in /run/cloudphone-job-budget /run/cloudphone-provider /run/cloudphone-public-test /opt/cloudphone-platform /opt/cloudphone-ngrok /etc/cloudphone-platform /etc/cloudphone-platform-web /var/lib/cloudphone-platform /var/lib/cloudphone; do
            [[ ! -e $target && ! -L $target ]] || { echo 'Deployment namespace already occupied; refusing changes'; exit 1; }
          done
          mkdir -m 0700 /run/cloudphone-job-budget
          chown 0:0 /run/cloudphone-job-budget
          # Never truncate a competing owner. Failure leaves unowned evidence for manual
          # inspection rather than deleting a potentially foreign directory or marker.
          (set -o noclobber; printf '%s\n' '92e85fcd77927a514583dc7b7f329537' > /run/cloudphone-job-budget/owner)
          chown 0:0 /run/cloudphone-job-budget/owner
          chmod 0600 /run/cloudphone-job-budget/owner

          CP_ROOT
          set -euo pipefail
          set +x
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          cd "$work"
          cat > lifetime.cjs <<'CP_LIFETIME'
          'use strict';
          const DURATIONS = [60, 120, 180, 360];
          const CLEANUP_RESERVE_MS = 300000;
          function lifetime(jobStartedAt, durationMinutes = 360, now = Date.now()) {
            const start = typeof jobStartedAt === 'number' ? jobStartedAt : Date.parse(jobStartedAt);
            if (!DURATIONS.includes(durationMinutes) || !Number.isSafeInteger(start) || start <= 0 || start > now || !Number.isSafeInteger(now)) throw Error('Invalid job lifetime');
            const jobDeadline = start + Math.min(durationMinutes, 360) * 60000;
            const expiresAt = jobDeadline - CLEANUP_RESERVE_MS;
            if (now >= expiresAt) throw Error('Job service budget exhausted');
            return { jobStartedAt: start, durationMinutes, jobDeadline, expiresAt };
          }
          module.exports = { DURATIONS, CLEANUP_RESERVE_MS, lifetime };
          CP_LIFETIME
          cat > job-budget.cjs <<'CP_BUDGET_JS'
          'use strict';
          const { lifetime } = require('./lifetime.cjs');
          const sleepDefault = ms => new Promise(resolve => setTimeout(resolve, ms));
          // Only network availability failures are retryable, never TLS/redirect/parse errors.
          function transportFailure(error) {
            const code = error?.cause?.code || error?.code;
            return ['ECONNRESET','ECONNREFUSED','ETIMEDOUT','EAI_AGAIN','ENOTFOUND','EPIPE','UND_ERR_CONNECT_TIMEOUT','UND_ERR_HEADERS_TIMEOUT','UND_ERR_BODY_TIMEOUT','UND_ERR_SOCKET'].includes(code) ||
              ['AbortError','TimeoutError'].includes(error?.name);
          }
          async function acquireBudget({repository, runId, attempt, jobName, token, durationMinutes, fetchImpl = fetch, now = Date.now, sleep = sleepDefault}) {
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository) || !/^[1-9][0-9]*$/.test(runId) || !/^[1-9][0-9]*$/.test(attempt) || !token || !jobName) throw Error('Job context missing');
            const transient = Symbol('transient');
            let deadline = now() + 120000, knownStart, knownId;
            const remaining = () => { const ms = deadline - now(); if (ms <= 0) throw Error('Job metadata retry budget exhausted'); return ms; };
            for (;;) {
              const requestMs = Math.min(20000, remaining());
              const controller = new AbortController();
              let timer;
              const timeout = new Promise((_, reject) => { timer = setTimeout(() => {
                controller.abort(); reject(new DOMException('Metadata request timeout', 'TimeoutError'));
              }, requestMs); });
              let data = transient;
              try {
                data = await Promise.race([timeout, (async () => {
                  const response = await fetchImpl(`https://api.github.com/repos/${repository}/actions/runs/${runId}/attempts/${attempt}/jobs?per_page=100`, {
                    redirect:'error', signal:controller.signal, headers:{Authorization:'Bearer '+token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}
                  });
                  if (response.status === 429 || (response.status >= 500 && response.status <= 599)) return transient;
                  if (response.status !== 200) throw Error('Job start unavailable');
                  let value;
                  if (response.body) {
                    const chunks = []; let size = 0;
                    for await (const chunk of response.body) {
                      size += chunk.length;
                      if (size > 1024 * 1024) throw Error('Job metadata response too large');
                      chunks.push(Buffer.from(chunk));
                    }
                    value = JSON.parse(Buffer.concat(chunks).toString('utf8'));
                  } else {
                    // Compatibility for older injected test fetches; real Fetch streams above.
                    value = await response.json();
                    if (Buffer.byteLength(JSON.stringify(value)) > 1024 * 1024) throw Error('Job metadata response too large');
                  }
                  return value;
                })()]);
              } catch (error) {
                if (!transportFailure(error)) throw error;
              } finally { clearTimeout(timer); controller.abort(); }
              remaining();
              if (data !== transient) {
                if (!data || typeof data !== 'object' || !Number.isSafeInteger(data.total_count) || data.total_count < 0 || !Array.isArray(data.jobs) || data.total_count !== data.jobs.length || data.total_count > 100 ||
                    data.jobs.some(j => !j || typeof j !== 'object' || typeof j.name !== 'string')) throw Error('Invalid job metadata');
                const jobs = data.jobs.filter(j => j.name === jobName);
                if (jobs.length > 1) throw Error('Ambiguous current job');
                if (jobs.length === 1) {
                  const job = jobs[0];
                  if ((job.run_id != null && String(job.run_id) !== runId) || (job.run_attempt !== undefined && String(job.run_attempt) !== attempt)) throw Error('Wrong job run/attempt');
                  if (job.id !== undefined) {
                    if (!/^[1-9][0-9]*$/.test(String(job.id))) throw Error('Invalid job identity');
                    if (knownId !== undefined && String(job.id) !== knownId) throw Error('Job identity changed');
                    knownId = String(job.id);
                  }
                  if (!['queued','waiting','pending','in_progress'].includes(job.status)) throw Error('Invalid current job status');
                  if (job.started_at != null) {
                    if (typeof job.started_at !== 'string' || !job.started_at) throw Error('Invalid job start');
                    const budget = lifetime(job.started_at, durationMinutes, now());
                    if (knownStart !== undefined && knownStart !== budget.jobStartedAt) throw Error('Job start changed');
                    knownStart = budget.jobStartedAt;
                    deadline = Math.min(deadline, budget.expiresAt);
                    remaining();
                    if (job.run_id != null && job.status === 'in_progress') return budget;
                  }
                }
              }
              await sleep(Math.min(1000, remaining()));
            }
          }
          module.exports = { acquireBudget };
          if (require.main === module) acquireBudget({repository:process.env.GITHUB_REPOSITORY,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,
            jobName:'Cloudphone Deployment',token:process.env.CP_JOB_TOKEN,durationMinutes:Number(process.env.CP_DURATION)})
            .then(b => process.stdout.write(JSON.stringify(b)))
            .catch(() => { console.error('Cannot establish total job budget; refusing install.'); process.exitCode=1; });
          CP_BUDGET_JS
          node job-budget.cjs > budget.json
          node -e 'const b=JSON.parse(require("fs").readFileSync("budget.json")); if(!Number.isSafeInteger(b.expiresAt)||! /^[1-9][0-9]{12}$/.test(String(b.expiresAt))) process.exit(1); console.log(b.expiresAt)' > deadline
          sudo install -o root -g root -m 0600 budget.json deadline /run/cloudphone-job-budget/
      - name: Stage Root-private Recovery Helpers
        id: stage_recovery
        run: |
          set -euo pipefail
          set +x
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LANG=C /bin/bash --noprofile --norc -se <<'CP_ROOT'
          set -euo pipefail
          set +x
          umask 077
          [[ $EUID = 0 ]] || exit 1
          budget=/run/cloudphone-job-budget
          [ -d "$budget" ] && [ ! -L "$budget" ]
          [ "$(stat -c %u:%g:%a "$budget")" = 0:0:700 ]
          [ -f "$budget/owner" ] && [ ! -L "$budget/owner" ]
          [ "$(stat -c %u:%g:%a:%h "$budget/owner")" = 0:0:600:1 ]
          [ "$(cat "$budget/owner")" = '92e85fcd77927a514583dc7b7f329537' ]
          cd "$budget"
          cat > cleanup.sh <<'CP_CLEANUP'
          #!/usr/bin/env bash
          # Parent stages this file and the fence helper before any installer can start.
          # All flock, ownership, exact fencing, and recovery actions live in the helper.
          set +x
          set +e
          umask 077
          if [[ $EUID != 0 ]]; then
            printf '%s\n' '{"schema":1,"ok":false,"failures":[{"phase":"root-required"}]}'
            exit 1
          fi
          # No Node dependency before installation. GNU timeout caps this entire invocation,
          # including shared-lock acquisition; helper command trees have their own caps.
          /usr/bin/timeout --signal=KILL 210s /usr/bin/python3 -I -B /run/cloudphone-job-budget/recovery-fence.py '92e85fcd77927a514583dc7b7f329537'
          cleanup_status=$?
          if (( cleanup_status != 0 )); then
            printf '{"schema":1,"ok":false,"failures":[{"phase":"cleanup-process-failed","exitCode":%d}]}\n' "$cleanup_status"
          fi
          exit "$cleanup_status"
          CP_CLEANUP
          base64 --decode <<'CP_FENCE_GZIP' | gzip --decompress > recovery-fence.py
          
          CP_FENCE_GZIP
          chown root:root recovery-fence.py
          chmod 0600 recovery-fence.py
          base64 --decode <<'CP_RECOVERY_GZIP' | gzip --decompress > recovery.mjs
          
          CP_RECOVERY_GZIP
          chown root:root recovery.mjs
          chmod 0600 recovery.mjs
          cat > deadline-guard.sh <<'CP_GUARD'
          #!/usr/bin/env bash
          # Node-independent one-shot guard; readiness is acknowledged only after validation.
          set -euo pipefail
          set +x
          umask 077
          budget=/run/cloudphone-job-budget
          read -r deadline < "$budget/deadline"
          [[ $deadline =~ ^[1-9][0-9]{12}$ ]] || exit 1
          [[ $((deadline - $(date +%s%3N))) -gt 0 ]] || exit 1
          printf '%s\n' "$deadline" > "$budget/guard-ready"
          while :; do
            remaining=$(( (deadline - $(date +%s%3N)) / 1000 ))
            (( remaining > 0 )) || break
            delay=30
            (( remaining >= delay )) || delay=$remaining
            sleep "$delay"
          done
          # Explicit failure is retained by systemd, not disguised as successful cleanup.
          /bin/bash "$budget/cleanup.sh"
          CP_GUARD
          cat > guard-check.sh <<'CP_GUARD_CHECK'
          set -euo pipefail
          set +x
          # Handshake + current liveness; no /usr/bin/node prerequisite.
          expected=$(cat /run/cloudphone-job-budget/deadline)
          [[ $expected =~ ^[1-9][0-9]{12}$ ]] || exit 1
          [[ $(cat /run/cloudphone-job-budget/guard-ready) = "$expected" ]] || exit 1
          [[ $((expected - $(date +%s%3N))) -gt 0 ]] || exit 1
          systemctl is-active --quiet cloudphone-job-deadline.service
          CP_GUARD_CHECK
          chown root:root cleanup.sh deadline-guard.sh guard-check.sh
          chmod 0600 cleanup.sh deadline-guard.sh guard-check.sh
          CP_ROOT
      - name: Start and Verify Deadline Guard
        id: start_guard
        run: |
          set -euo pipefail
          set +x
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LANG=C /bin/bash --noprofile --norc -se <<'CP_ROOT'
          set -euo pipefail
          set +x
          umask 077
          [[ $EUID = 0 ]] || exit 1
          budget=/run/cloudphone-job-budget
          [ -d "$budget" ] && [ ! -L "$budget" ]
          [ "$(stat -c %u:%g:%a "$budget")" = 0:0:700 ]
          [ -f "$budget/owner" ] && [ ! -L "$budget/owner" ]
          [ "$(stat -c %u:%g:%a:%h "$budget/owner")" = 0:0:600:1 ]
          [ "$(cat "$budget/owner")" = '92e85fcd77927a514583dc7b7f329537' ]
          systemd-run --quiet --unit=cloudphone-job-deadline --property=Restart=no --property=Type=exec --property=TimeoutStopSec=4s /bin/bash "$budget/deadline-guard.sh"
          /usr/bin/timeout --signal=KILL 5s /bin/bash -se <<'CP_HANDSHAKE'
          set -euo pipefail
          ready=no
          for attempt in {1..50}; do
            if /bin/bash /run/cloudphone-job-budget/guard-check.sh 2>/dev/null; then ready=yes; break; fi
            sleep 0.1
          done
          [ "$ready" = yes ] || { echo "::error::Deadline guard failed readiness/liveness handshake"; exit 1; }
          /bin/bash /run/cloudphone-job-budget/guard-check.sh
          CP_HANDSHAKE
          CP_ROOT
      - name: Preflight Environment Check
        run: |
          echo "======================================================"
          echo "   PROTON CLOUDPHONE // DASHBOARD // ANDROID 16"
          echo "======================================================="
          echo "[INFO] Arch : $(uname -m)"
          echo "[INFO] OS   : $(lsb_release -ds 2>/dev/null || head -1 /etc/os-release)"
          echo "[INFO] PID1 : $(cat /proc/1/comm)"
          if [ -e /dev/kvm ]; then
            echo "[OK] KVM acceleration device present."
          else
            echo "[WARN] /dev/kvm not present - phone creation may be rejected by the platform."
          fi
          echo "[INFO] Disk space:"
          df -h / /opt /var/lib 2>/dev/null || df -h /
          echo "[INFO] Node: $(node --version 2>/dev/null || echo 'not found')"
          echo '[INFO] Memory (kB):'
          grep -E '^Mem(Total|Available):' /proc/meminfo
          ls -l /dev/kvm 2>/dev/null || true
          if sudo test -r /dev/kvm && sudo test -w /dev/kvm; then echo '[OK] Root can read/write KVM'; else echo '[WARN] Root cannot read/write KVM'; fi
      - name: Free Runner Disk Space (50 GiB Preflight Requirement)
        run: |
          echo "[INFO] Disk before cleanup:"
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby 2>/dev/null || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          echo "[INFO] Disk after cleanup:"
          df -h / | tail -1
      - name: Normalize Runner Host (secure_path Compliance)
        run: |
          echo "[INFO] Hosted runner images ship /usr/local/bin 0777 AND run 'chmod -R 777"
          echo "[INFO] /usr/local/lib/node_modules' (runner-images issue #267). The platform"
          echo "[INFO] secure_path() rejects group/other-writable FILES as well as dirs -"
          echo "[INFO] including /usr/local/bin/node itself and npm's resolved module tree."
          echo "[INFO] Pre-fix state:"
          ls -ld /usr/local /usr/local/bin /usr/local/bin/node /usr/local/bin/npm /usr/local/lib /usr/local/lib/node_modules /opt /usr/bin /srv 2>/dev/null || true
          FAIL=0
          heal_dir() {
            if [ ! -d "$1" ]; then
              echo "[FIX] $1 missing - creating root-owned 0755 directory."
              sudo install -d -o root -g root -m 0755 "$1"
            else
              sudo chown root:root "$1" 2>/dev/null || true
              sudo chmod 0755 "$1" 2>/dev/null || true
            fi
          }
          BASE_DIRS="/usr/local /usr/local/bin /usr/local/lib /opt /usr/bin /var /var/lib /etc /etc/systemd /etc/systemd/system /srv"
          for P in $BASE_DIRS; do heal_dir "$P" || { echo "[ERROR] Heal failed for $P"; FAIL=1; }; done
          echo "[FIX] Repairing /usr/local/lib/node_modules tree (root-owned, strip group/other write)..."
          if [ -d /usr/local/lib/node_modules ]; then
            sudo chown -R root:root /usr/local/lib/node_modules
            sudo chmod -R go-w /usr/local/lib/node_modules
          fi
          echo "[FIX] Strip group/other write from every binary in /usr/local/bin (node/npm are 0777)..."
          sudo chmod go-w /usr/local/bin/* 2>/dev/null || true
          echo "[INFO] Verifying with an exact mirror of the installer's secure_path()..."
          verify_secure_path() {
            P=$(readlink -e -- "$1" 2>/dev/null) || { echo "[ERROR] Missing/unresolvable: $1"; FAIL=1; return 1; }
            while :; do
              OWN=$(stat -c %u -- "$P" 2>/dev/null || echo MISSING)
              WR=$(find "$P" -maxdepth 0 -perm /022 -print 2>/dev/null || true)
              if [ "$OWN" != "0" ] || [ -n "$WR" ]; then
                echo "[ERROR] secure_path would reject: $P (owner=$OWN writable=${WR:-no})"
                FAIL=1
                return 1
              fi
              echo "[OK] $P compliant"
              [ "$P" != "/" ] || return 0
              P=$(dirname -- "$P")
            done
            return 0
          }
          for P in /usr/bin /usr/local/bin /opt /srv; do verify_secure_path "$P" || FAIL=1; done
          INSTALLER_PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          NODE_BIN=$(PATH="$INSTALLER_PATH" command -v node 2>/dev/null || true)
          NPM_BIN=$(PATH="$INSTALLER_PATH" command -v npm 2>/dev/null || true)
          echo "[INFO] Installer sanitized PATH resolves: node=${NODE_BIN:-<none>} npm=${NPM_BIN:-<none>}"
          [ -z "$NODE_BIN" ] || { verify_secure_path "$NODE_BIN" || FAIL=1; }
          [ -z "$NPM_BIN" ] || { verify_secure_path "$NPM_BIN" || FAIL=1; }
          if [ -d /usr/local/lib/node_modules ]; then
            BAD=$(find /usr/local/lib/node_modules \( ! -user root -o \( ! -type l -perm /022 \) \) -print -quit 2>/dev/null || true)
            if [ -n "$BAD" ]; then
              echo "[ERROR] node_modules tree still unsafe at: $BAD"
              FAIL=1
            else
              echo "[OK] /usr/local/lib/node_modules tree fully root-owned and non-writable"
            fi
          fi
          if [ "$FAIL" != "0" ]; then
            echo "[ERROR] Host normalization failed - installer would reject this host."
            exit 1
          fi
          echo "[OK] Runner host normalized - secure_path normalization complete; official preflight still required."
      - name: Stage Pinned Local Helpers (reviewed base 9ef01ceb48459bcc0a539dbb1364fc766cbbde71)
        run: |
          set -euo pipefail
          set +x
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LANG=C /bin/bash --noprofile --norc -se <<'CP_ROOT'
          set -euo pipefail
          set +x
          umask 077
          [ "$EUID" = 0 ]
          # Fresh directory only: reject an existing directory or symlink.
          mkdir -m 0700 /run/cloudphone-public-test
          cd /run/cloudphone-public-test
          base64 --decode > bootstrap-local.sh <<'CP_HELPER_BASE64'
          
          CP_HELPER_BASE64
          chmod 0600 bootstrap-local.sh
          base64 --decode > staged-source.py <<'CP_HELPER_BASE64'
          
          CP_HELPER_BASE64
          chmod 0600 staged-source.py
          cat > access-public.pem <<'CP_PUBLIC_KEY'
