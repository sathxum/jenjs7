          for attempt in $(seq 1 60); do
            if systemctl is-active --quiet cloudphone-platform.service &&
               systemctl is-active --quiet cloudphone-platform-broker.service &&
               systemctl is-active --quiet cloudphone-platform-tunnel.service &&
               node <<'CP_CURRENT'
          const fs = require('node:fs'), cp = require('node:child_process');
          const { currentOrigin } = require('./provider.cjs');
          const { lifetime } = require('./lifetime.cjs');
          try {
            const budget = JSON.parse(fs.readFileSync('/run/cloudphone-job-budget/budget.json'));
            lifetime(budget.jobStartedAt, budget.durationMinutes);
            const config = JSON.parse(fs.readFileSync('/etc/cloudphone-platform-web/config.json'));
            const invocation = cp.execFileSync('systemctl', ['show','cloudphone-platform-tunnel.service','-p','InvocationID','--value']).toString().trim();
            const origin = currentOrigin(config, 'cloudflare', invocation, true);
            fs.writeFileSync('managed-url', origin + '\n', {mode:0o600});
