              with os.scandir(fd) as entries:
                  for entry in entries:
                      if budget <= 0:
                          return
                      budget -= 1
                      name = entry.name
                      rel = parts + [name]
                      try:
                          st = os.stat(name, dir_fd=fd, follow_symlinks=False)
                          inventory.write(json.dumps({'path': '/'.join(rel), 'mode': oct(stat.S_IMODE(st.st_mode)),
