              headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              // Create-only; never overwrite a previous run/attempt. Contents pushes by GITHUB_TOKEN do not trigger workflows.
              body: JSON.stringify({ message: 'Publish encrypted access for run ' + runId, branch, content: Buffer.from(envelope).toString('base64') }) });
            if (response.status !== 201) throw Error('GitHub ciphertext publication failed');
          }
          module.exports = { publish };
          {
            Promise.resolve().then(() => publish({ repository: process.env.GITHUB_REPOSITORY, runId: process.env.GITHUB_RUN_ID,
              attempt: process.env.GITHUB_RUN_ATTEMPT, branch: process.env.GITHUB_REF_NAME, token: process.env.CP_GITHUB_TOKEN,
              envelope: execFileSync('sudo', ['cat', '/run/cloudphone-public-test/access-envelope.json'], { maxBuffer: 16384 }).toString() }))
              .then(() => console.log('Encrypted access published to GitHub.'))
              .catch(() => { console.error('Ciphertext publication failed; connection is not READY.'); process.exitCode = 1; });
