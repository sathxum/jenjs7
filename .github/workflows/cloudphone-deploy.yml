            const start = typeof jobStartedAt === 'number' ? jobStartedAt : Date.parse(jobStartedAt);
            if (!DURATIONS.includes(durationMinutes) || !Number.isSafeInteger(start) || start <= 0 || start > now || !Number.isSafeInteger(now)) throw Error('Invalid job lifetime');
            const jobDeadline = start + Math.min(durationMinutes, 360) * 60000;
            const expiresAt = jobDeadline - CLEANUP_RESERVE_MS;
            if (now >= expiresAt) throw Error('Job service budget exhausted');
            return { jobStartedAt: start, durationMinutes, jobDeadline, expiresAt };
          }
          module.exports = { DURATIONS, CLEANUP_RESERVE_MS, lifetime };
          CP_LIFETIME
          cat > live-check.cjs <<'CP_LIVE_CHECK'
          'use strict';
          const fs=require('node:fs'),cp=require('node:child_process');
          const {lifetime}=require('./lifetime.cjs'),{currentOrigin}=require('./provider.cjs');
          function check(expected, provider, io = {fs,cp}) {
            const {fs,cp}=io;
            if(fs.existsSync('/run/cloudphone-job-budget/expired'))throw Error('Expired');
            const budget=JSON.parse(fs.readFileSync('/run/cloudphone-job-budget/budget.json'));
            const validated=lifetime(budget.jobStartedAt,budget.durationMinutes);
            cp.execFileSync('/bin/bash',['/run/cloudphone-job-budget/guard-check.sh'],{stdio:'pipe',timeout:5000});
