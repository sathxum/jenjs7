      - name: Stage Reviewed Source Archive (4/22)
        run: |
          set -euo pipefail
          set +x
          sudo /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LANG=C /bin/bash --noprofile --norc -se <<'CP_ROOT'
          set -euo pipefail
          set +x
