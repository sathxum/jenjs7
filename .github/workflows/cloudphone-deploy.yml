          import json, os, stat, sys, traceback
          from pathlib import Path
          out = Path(sys.argv[1]) / 'state'
          out.mkdir(mode=0o700)
          D = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
          F = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK
