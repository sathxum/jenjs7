            currentOrigin(config,provider,invocation,true);
            if(config.publicOrigin!==expected.publicOrigin || config.tunnelInvocationId!==expected.tunnelInvocationId || config.mode!==expected.mode || config.port!==expected.port)throw Error('Managed origin changed');
            return Math.floor((validated.expiresAt-Date.now())/1000);
          }
          module.exports={check};
          if(require.main===module){
            try{const receipt=JSON.parse(fs.readFileSync('/run/cloudphone-public-test/access-receipt.json'));const seconds=check(receipt.config,receipt.tunnelType);if(seconds<25)throw Error('Insufficient publication budget');process.stdout.write(String(seconds));}
