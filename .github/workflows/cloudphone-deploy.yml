          'use strict';
          // Only this step receives github.token. GitHub permissions are job-scoped, not step-scoped.
          const { execFileSync } = require('node:child_process');
          async function publish({ repository, runId, attempt, branch, token, envelope, fetchImpl = fetch }) {
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository) || !/^[1-9][0-9]*$/.test(runId) ||
                !/^[1-9][0-9]*$/.test(attempt) || !branch || !token) throw Error('Publication context unavailable');
            const e = JSON.parse(envelope);
            if (Buffer.byteLength(envelope) > 16384 || e.version !== 1 || e.algorithm !== 'RSA-OAEP-256+A256GCM' ||
