          # Only the normal finalizer stops the guard, after cleanup has returned.
          stop_status=0
          /usr/bin/timeout --signal=KILL 5s systemctl stop cloudphone-job-deadline.service || stop_status=$?
          if (( stop_status != 0 )); then
            printf '{"schema":1,"ok":false,"failures":[{"phase":"guard-stop-failed","exitCode":%d}]}\n' "$stop_status"
            (( cleanup_status != 0 )) || cleanup_status=$stop_status
          fi
          exit "$cleanup_status"

          CP_ROOT
    name: Cloudphone Deployment
