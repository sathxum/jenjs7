          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqKXut8M9CgBfyPlTf43a
          StChmA5OTCllkKuF78zHgL5UhhjkeY5sKVDIbxc7Bfj5Ze6V+HCJBpO7sbW7jWdL
          2T/plmEG1E9IjX6+YUNwG8yAusSDoi8B5bLCq7/ImWMg1N5jrQXxHh8dYPexbhMd
          qyEOatHXp13A3ppUKSMjr7uga/j0JXZgTftWP0F1X5GCHTjmlAX8fNSHMXCeGrwk
          aXFT323FapUG9rt3tpu8kMVkuB/Q2vH9cyQRrxnQX01wEo2fBRvEk9YGYz7l/z9A
          M1S/XuEKbe0WVH7fJ3cTqEySSWrYOeUip0Xlibqooa4LPQsfzCvnzdJnKVehpHEG
          kVcQbB2b4MmuK9i+hAjvdY+/ztkFYZWVeqhdciIoBS81zf8BUP5AqqlwT+zAZ+BS
          hGDWFtvXMBY/XgRcfuHSjcNZRw/5HW3UkntWFTPzYuc68lv/uLtQokHcEPiHP9/a
          wHtv7q2CANC5LJlhBVmjOhBVNW7rnuWWEFK9HuFKICV/AgMBAAE=
          -----END PUBLIC KEY-----
          CP_PUBLIC_KEY
